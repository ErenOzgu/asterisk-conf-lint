[transport-tls]
type = transport
protocol = tls
bind = 0.0.0.0:5061
method = sslv3

[anonymous]
type = endpoint
context = default

[200]
type = endpoint
context = default
aors = 200

[201]
type = endpoint
context = default
auth = auth201
aors = 201

[auth201]
type = auth
username = 201
password = 201

[trunk-identify]
type = identify
endpoint = 201
match = 0.0.0.0/0
