[internal]
exten => 600,1,Answer()
 same => n,Playback(demo-echodone)
 same => n,Hangup()
exten => _10X,1,Dial(PJSIP/${EXTEN},20)
 same => n,Hangup()
; Outbound calls only for a known endpoint.
exten => _00X.,1,GotoIf($["${CHANNEL(endpoint)}" = "101"]?ok:deny)
 same => n(ok),Dial(PJSIP/${EXTEN}@provider)
 same => n(deny),Hangup()

[from-trunk]
exten => _X.,1,Hangup()
